<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览区域结构 · 宽/高数据</title>
<style>
  body{margin:0;padding:24px;background:#F7F7F8;color:#171717;
    font-family:"PingFang SC","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .card{max-width:640px;margin:0 auto;background:#F7F7F8;border:1px solid rgba(23,23,23,.12);
    border-radius:12px;padding:20px;}
  .title{font-weight:500;font-size:14px;line-height:20px;}
  .cap{font-size:12px;line-height:18px;color:#52525B;}
  .outer{position:relative;border:2px dashed #4B3FE3;border-radius:12px;
    padding:18px 16px 16px;margin-top:16px;}
  .tag{position:absolute;top:-10px;left:14px;background:#F7F7F8;padding:0 6px;color:#4B3FE3;font-size:12px;}
  .tabs{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;
    background:#EFEFF2;border:1px solid rgba(23,23,23,.12);font-size:12px;color:#52525B;}
  .cardbox{border:2px solid #4B3FE3;border-radius:8px;margin-top:14px;padding:14px;background:#F2F7FF;}
  .cardbox .cap{color:#1A1759;font-weight:500;}
  .lines{display:grid;gap:6px;margin-top:12px;}
  .line{height:6px;border-radius:3px;background:#4B3FE3;}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;}
  .item{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#52525B;}
  .sw{width:22px;height:16px;border-radius:4px;flex:none;}
  .sw-outer{border:1px solid rgba(23,23,23,.12);background:#F7F7F8;}
  .sw-card{border:2px solid #4B3FE3;background:transparent;box-sizing:border-box;}
  .note{margin-top:18px;font-size:12px;line-height:18px;color:#52525B;}
</style>
</head>
<body>
<div class="card">
  <div class="title">预览区域结构 · 宽 / 高数据</div>

  <div class="outer">
    <span class="tag">预览外框（区域）　高 244dp · 宽 = 整行（≈486dp）</span>
    <span class="tabs">小组件 #1</span>

    <div class="cardbox">
      <div class="cap">宽 360dp · 高 180dp</div>
      <div class="lines">
        <div class="line" style="width:55%"></div>
        <div class="line" style="width:44%"></div>
        <div class="line" style="width:63%"></div>
        <div class="line" style="width:39%"></div>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="item"><span class="sw sw-outer"></span>预览外框（容器 / 区域）· 高 244dp · 宽 = 整行</div>
    <div class="item"><span class="sw sw-card"></span>预览卡片（小组件）· 宽 360dp × 高 180dp</div>
  </div>

  <p class="note">说明：宽度为响应式（外框占整行，卡片固定 360dp），高度数据为真实 dp 值；示意图比例为便于观看放缩。</p>
</div>
</body>
</html>
