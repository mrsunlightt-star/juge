# ─────────────────────────────────────────────────────────────────────────────
# 句阁支付服务 Nginx —— **location 片段**（只含 location 段，不含 server{}）
#
# 背景：生产 https://puretxt.cn/api/alipay/{create,query,auth-info,recover,notify}
# 曾全部返回 404 —— 443 上只配了静态站点，没有一条把 /api/* 转给 Spring Boot 8081
# 的规则。客户端把 404 的 HTML 当空 JSONObject 解析，最终给用户看「下单失败」，
# 把一次部署事故伪装成网络故障。
#
# ── 安装（只有这一种方式，不要整文件 cp 进 conf.d/）──────────────────────────
#   sudo install -m 644 deploy/nginx-juge-api.conf \
#       /etc/nginx/snippets/juge-api-locations.conf
#   # 在 puretxt.cn 现存的 `server { listen 443 ssl; ... }` 块内加一行：
#   #     include snippets/juge-api-locations.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# 为什么只给 location 段：
#   - 线上 443 server 已经在服务静态站点。再声明一个同 server_name + listen 的
#     server 块会冲突，nginx 只取先加载的那个，API 规则反而永远不生效。
#   - upstream / limit_req_zone 属于 http 上下文，放进 server{} 内 nginx -t 直接报错；
#     这里直接 proxy_pass 到回环地址，不依赖任何仓库外的片段文件。
#   - 业务限流在应用层 PayApiThrottle（已修 X-Forwarded-For 绕过），
#     nginx 层不加也能挡住刷单；需要粗粒度防洪时见文末「可选」。
#
# 前置：Spring Boot 只监听 127.0.0.1:8081（application.yml 的 server.address）。
# ─────────────────────────────────────────────────────────────────────────────

location /api/ {
    # 不带 URI 后缀 = 原样透传 /api/... 路径，后端 @RequestMapping("/api/alipay") 才接得住
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;

    # 关键：**覆写**而非追加。
    # $proxy_add_x_forwarded_for 会把客户端自带的 XFF 原样保留在最左边，
    # 而 AlipayController.clientIp() 只在直连对端是可信回环时才采信转发头、
    # 并取最后一个值；写成追加语义会让伪造值留在链里，限流形同虚设。
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 支付宝异步通知是表单 POST，最大几十 KB；下单/查单是 JSON。10m 足够且能挡大包。
    client_max_body_size 10m;

    # 后端是本地回环，正常都在 100ms 内；给网关留 30s 余量（支付宝下单要出网）
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # 不缓存任何 API 响应：查单结果是权威结论，缓存会让客户端读到过期状态
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# 支付宝异步通知单独放宽：它必须始终可达，不能被通用限流误伤。
# nginx 的 location 是「最长前缀优先」，这条比 /api/ 更精确，所以会命中它。
location = /api/alipay/notify {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 30s;
    proxy_buffering off;
}

# ─────────────────────────────────────────────────────────────────────────────
# 可选：nginx 层的粗粒度防洪
#   在 nginx.conf 的 http {} 里加一行（**不能**放进 server{} 或本片段）：
#       limit_req_zone $binary_remote_addr zone=juge_api:10m rate=30r/s;
#   然后分别给上面两条 location 加：
#       limit_req zone=juge_api burst=60 nodelay;    # /api/
#       limit_req zone=juge_api burst=200 nodelay;   # notify
#   notify 的 burst 必须更大：支付宝重投是成批到达的，误伤等于丢单。
#
# 验证（部署后必须跑，四条都不该是 nginx 的 HTML 404）：
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST https://puretxt.cn/api/alipay/auth-info
#       → 503（pid 未配）或 200（已配）；**不应是 404**
#   curl -s -o /dev/null -w '%{http_code}\n' 'https://puretxt.cn/api/alipay/query?outTradeNo=x'
#       → 404 + JSON body（{"success":false,"code":"ORDER_MISSING"}）；**不应是 HTML 404**
#   curl -s 'https://puretxt.cn/api/alipay/query?outTradeNo=x' | head -c 80
#       → 必须是 JSON，不能是 nginx 的 <html> 错误页
#   curl -s -H 'X-Forwarded-For: 1.2.3.4' -X POST https://puretxt.cn/api/alipay/auth-info
#       → 观察应用日志里的 clientIp 应是真实来源，不是 1.2.3.4
#
# 回滚：删掉 server 块里那行 include，reload nginx 即可；本片段本身不影响静态站。
# ─────────────────────────────────────────────────────────────────────────────
